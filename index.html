 journ\xE9e",tags:["NEIGE"],iso:"2027-04-13",heure:"06:00",duree:"Journ\xE9e",nbJours:1,niveau:"Initi\xE9",prix:190,places:5,restantes:5,guide:"Chris",statut:null,description:"La course de printemps par excellence : mont\xE9e r\xE9guli\xE8re depuis Siviez, sommet panoramique sur les 4000 valaisans et grande descente en neige transform\xE9e.",materiel:"Skis de rando avec couteaux ; DVA-pelle-sonde fournis si besoin.",prerequis:"1000 m de mont\xE9e \xE0 un rythme tranquille.",inclus:"Guide UIAGM. Non compris : remont\xE9es Siviez, repas."},{id:18,titre:"Ski & voile \u2014 Alpes de Lyngen, Norv\xE8ge (vols non compris)",tags:["MER","NEIGE","EXPE"],iso:"2027-04-24",heure:"\u2014",duree:"1 semaine",nbJours:7,niveau:"Confirm\xE9",prix:4900,places:6,restantes:6,guide:"Greg",statut:null,description:"Une semaine \xE0 bord d'un voilier polaire sous le soleil de minuit : chaque matin, annexe vers un fjord diff\xE9rent, sommets de 1000 \xE0 1500 m\xE8tres skis aux pieds jusqu'\xE0 la mer. Le produit qui a fait la r\xE9putation des voyages arctiques \u2014 version Altiora.",programme:["Jour 1 \u2014 Vol Troms\xF8 (individuel), embarquement, briefing s\xE9curit\xE9","Jours 2-6 \u2014 Un sommet par jour selon m\xE9t\xE9o : Lakselvtinden, Store Kjostinden, R\xF8rnestinden\u2026","Jour 7 \u2014 Derni\xE8re peau matinale, retour Troms\xF8"],materiel:"Mat\xE9riel complet de ski de rando + affaires de mer chaudes (liste d\xE9taill\xE9e).",prerequis:"Skieur de randonn\xE9e r\xE9gulier : 1000 \xE0 1400 m par jour, toutes neiges.",inclus:"Guide UIAGM, skipper, pension compl\xE8te \xE0 bord, sauna du bord. Non compris : vols Troms\xF8, boissons \xE0 terre."},{id:19,titre:"Exp\xE9dition voile & ski \u2014 c\xF4te Est du Groenland",tags:["MER","NEIGE","EXPE"],iso:"2027-05-03",heure:"\u2014",duree:"4 semaines",nbJours:28,niveau:"Confirm\xE9",prix:18900,places:6,restantes:6,guide:"Greg",statut:null,description:"Quatre semaines d'exploration dans les fjords du Scoresby Sund : navigation dans le
